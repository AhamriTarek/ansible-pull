---
- name: Deploiement Nginx via ansible-pull
  hosts: localhost
  connection: local
  become: yes
  tasks:
    - name: Installer Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Supprimer l'ancienne page par defaut
      file:
        path: /var/www/html/index.nginx-debian.html
        state: absent

    - name: Deployer la nouvelle page web
      copy:
        content: |
          <!DOCTYPE html>
          <html lang="fr"><head><meta charset="UTF-8"></head>
          <body style="font-family:sans-serif;text-align:center;padding:50px">
          <h1>Serveur deploye automatiquement par Ansible (TAREK ADMIN)</h1>
          <p>Mode Pull | Nginx | ansible-pull</p>
          </body></html>
        dest: /var/www/html/index.html

    - name: Redemarrer Nginx
      service:
        name: nginx
        state: restarted
        enabled: yes
