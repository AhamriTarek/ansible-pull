---
- name: Deploiement Nginx via ansible-pull
  hosts: localhost
  connection: local
  become: yes
  tasks:
    - name: Arreter et desactiver Apache
      service:
        name: apache2
        state: stopped
        enabled: no
      ignore_errors: yes

    - name: Installer Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Supprimer l'ancienne page par defaut
      file:
        path: /var/www/html/index.nginx-debian.html
        state: absent

    - name: Deployer la nouvelle page web
      copy:
        content: |
          <!DOCTYPE html>
          <html lang="fr"><head><meta charset="UTF-8"></head>
          <body style="font-family:sans-serif;text-align:center;padding:50px">
          <h1>Serveur deploye automatiquement par Ansible (TAREK ADMIN)</h1>
          <p>Mode Pull | Nginx | ansible-pull</p>
          </body></html>
        dest: /var/www/html/index.html

    - name: Demarrer Nginx
      service:
        name: nginx
        state: restarted
        enabled: yes
        
    - name: Telecharger le paquet Google Chrome
      get_url:
        url: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        dest: /tmp/google-chrome.deb

    - name: Installer Google Chrome
      apt:
        deb: /tmp/google-chrome.deb
        state: present
- import_playbook: info.yml
